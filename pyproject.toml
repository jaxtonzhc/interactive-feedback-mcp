[project]
name = "interactive-feedback-mcp"
version = "0.1.5"
description = "MCP server for interactive user feedback in AI-assisted development."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.5.1",
    "psutil>=7.0.0",
    "pyside6>=6.8.2.1",
    "markdown>=3.4.0",
    "pygments>=2.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gui: marks tests that require a display (deselect with '-m \"not gui\"')",
]
